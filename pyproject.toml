[project]
name = "arknights-macos-runtime-scripts"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "actionlint-py==1.7.12.25",
    "pytest==9.2.0",
    "pytest-socket==0.8.1",
    "ruff==0.17.5",
]

[tool.pytest.ini_options]
addopts = ["--disable-socket", "--strict-config", "--strict-markers"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
