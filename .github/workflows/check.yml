name: Check

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: check-${{ github.ref }}
    cancel-in-progress: true

env:
    PYTHONDONTWRITEBYTECODE: "1"

jobs:
    repository:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Check out source
              uses: actions/checkout@v7.0.1

            - name: Install uv
              uses: astral-sh/setup-uv@v10.0.1

            - name: Install just
              uses: extractions/setup-just@v4.0.0

            - name: Run repository checks
              run: just check

    patches:
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - name: Check out source
              uses: actions/checkout@v7.0.1

            - name: Install uv
              uses: astral-sh/setup-uv@v10.0.1

            - name: Apply patches
              run: uv run --locked --no-dev scripts/runtime.py prepare
