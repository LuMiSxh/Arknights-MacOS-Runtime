name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Run unit and lock checks
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          uv run --locked pytest
          uv run --locked ruff check scripts tests
          uv run --locked ruff format --check scripts tests
          uv run --locked --no-dev scripts/runtime.py validate-lock
          git diff --check

  patches:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        stage: [audio, cursor, cn, combined]
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Apply ${{ matrix.stage }} patches
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: uv run --locked --no-dev scripts/runtime.py prepare "${{ matrix.stage }}"
