name: Tag probe

on:
    workflow_dispatch:
        inputs:
            sha:
                description: Commit to tag; empty uses the run commit
                required: false
                default: ""

permissions:
    contents: write

jobs:
    probe:
        runs-on: ubuntu-24.04
        steps:
            - name: Probe tag creation
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  INPUT_SHA: ${{ inputs.sha }}
              run: |
                  set -u
                  gh --version
                  tag="probe-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
                  target="${INPUT_SHA:-$GITHUB_SHA}"
                  echo "creating refs/tags/$tag at $target"
                  gh api --include --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                    -f ref="refs/tags/$tag" \
                    -f sha="$target" || true
                  echo "--- delete ---"
                  gh api --include --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" || true
