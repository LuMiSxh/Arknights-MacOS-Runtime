name: Runtime Build

on:
    workflow_dispatch:
        inputs:
            version:
                description: Bare SemVer version, such as 1.0.0-rc1. Do not add a leading v or an architecture suffix.
                required: true
                type: string
            channel:
                description: candidate builds disposable artifacts. release also creates one draft release for both lanes.
                required: true
                type: choice
                default: candidate
                options:
                    - candidate
                    - release
            target:
                description: Lane to build. A release always builds both lanes.
                required: true
                type: choice
                default: both
                options:
                    - both
                    - rosetta-x86_64
                    - native-arm64
            arm64_release_id:
                description: Catalog release id for the ARM64 lane. Leave empty for the newest ARM64 release.
                required: false
                type: string

permissions: {}

concurrency:
    group: runtime-release
    cancel-in-progress: false

env:
    PYTHONDONTWRITEBYTECODE: "1"

jobs:
    prepare:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            contents: read
        outputs:
            x86_64: ${{ steps.plan.outputs.x86_64 }}
            arm64: ${{ steps.plan.outputs.arm64 }}
            release_tag: ${{ steps.plan.outputs.release_tag }}
        steps:
            - name: Check out the dispatched ref
              uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@v10.0.1

            - name: Validate the inputs and select the lanes
              id: plan
              shell: bash
              env:
                  VERSION: ${{ inputs.version }}
                  CHANNEL: ${{ inputs.channel }}
                  TARGET: ${{ inputs.target }}
                  REF_NAME: ${{ github.ref_name }}
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              run: |
                  set -euo pipefail
                  normalized="$(uv run --locked --no-dev python -c \
                    'import sys; from scripts.release.verify import normalize_version; print(normalize_version(sys.argv[1]))' \
                    "$VERSION")"
                  if [[ "$normalized" != "$VERSION" ]]; then
                    echo "error: the version must be bare SemVer, such as 1.0.0-rc1" >&2
                    exit 1
                  fi
                  if [[ "$CHANNEL" == release ]]; then
                    if [[ "$TARGET" != both ]]; then
                      echo "error: a release builds both lanes; set target to both" >&2
                      exit 1
                    fi
                    if [[ "$REF_NAME" != "$DEFAULT_BRANCH" ]]; then
                      echo "error: dispatch a release from the default branch" >&2
                      exit 1
                    fi
                  fi
                  x86_64=false
                  arm64=false
                  if [[ "$TARGET" == both || "$TARGET" == rosetta-x86_64 ]]; then x86_64=true; fi
                  if [[ "$TARGET" == both || "$TARGET" == native-arm64 ]]; then arm64=true; fi
                  {
                    echo "x86_64=$x86_64"
                    echo "arm64=$arm64"
                    echo "release_tag=v$VERSION"
                  } >> "$GITHUB_OUTPUT"

            - name: Refuse an existing tag or release
              if: ${{ inputs.channel == 'release' }}
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: ${{ steps.plan.outputs.release_tag }}
              run: |
                  set -euo pipefail
                  if git ls-remote --exit-code --refs origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
                    echo "error: tag $RELEASE_TAG already exists; corrections require a new version" >&2
                    exit 1
                  else
                    tag_status=$?
                    if [[ "$tag_status" -ne 2 ]]; then
                      echo "error: could not verify whether tag $RELEASE_TAG exists" >&2
                      exit 1
                    fi
                  fi

                  release_probe="$RUNNER_TEMP/runtime-release-probe"
                  if gh api --method GET --include \
                    "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
                    > "$release_probe" 2>/dev/null; then
                    echo "error: release $RELEASE_TAG already exists; corrections require a new version" >&2
                    exit 1
                  fi
                  http_status="$(awk '$1 ~ /^HTTP\// { status=$2 } END { print status }' "$release_probe")"
                  if [[ "$http_status" != 404 ]]; then
                    echo "error: could not prove that release $RELEASE_TAG does not exist" >&2
                    exit 1
                  fi

    # The two lanes are separate jobs so that the protected release-arm64 environment, with
    # its secret and variables, never reaches the x86_64 lane.
    build-x86_64:
        needs: prepare
        if: ${{ needs.prepare.outputs.x86_64 == 'true' }}
        runs-on: xcode-27
        timeout-minutes: 360
        permissions:
            contents: read
        env:
            CCACHE_DIR: ${{ github.workspace }}/.ccache
            CCACHE_BASEDIR: ${{ github.workspace }}
            CCACHE_COMPILERCHECK: content
            CCACHE_MAXSIZE: 1G
            LMISXH_AKMOCL_CCACHE: ccache
        steps:
            - name: Check out the dispatched ref
              uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@v10.0.1

            - name: Install Rosetta
              run: softwareupdate --install-rosetta --agree-to-license

            - name: Install Nix
              uses: cachix/install-nix-action@v31.11.1
              with:
                  extra_nix_config: |
                      extra-platforms = x86_64-darwin

            - name: Install build tools
              run: brew install ccache just mingw-w64 meson ninja

            - name: Restore compiler cache
              uses: actions/cache@v4.3.0
              with:
                  path: ${{ github.workspace }}/.ccache
                  key: ${{ runner.os }}-${{ runner.arch }}-ccache-x86_64-${{ hashFiles('runtime.lock.json') }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-${{ runner.arch }}-ccache-x86_64-${{ hashFiles('runtime.lock.json') }}-
                      ${{ runner.os }}-${{ runner.arch }}-ccache-x86_64-

            - name: Restore downloaded sources
              uses: actions/cache@v4.3.0
              with:
                  path: ${{ github.workspace }}/.build/downloads
                  key: ${{ runner.os }}-${{ runner.arch }}-downloads-${{ hashFiles('runtime.lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-${{ runner.arch }}-downloads-

            - name: Run repository checks
              run: just check

            - name: Build the runtime
              shell: bash
              env:
                  VERSION: ${{ inputs.version }}
                  CHANNEL: ${{ inputs.channel }}
              run: |
                  set -euo pipefail
                  if [[ "$CHANNEL" == release ]]; then
                    just build-release rosetta-x86_64 "$VERSION"
                  else
                    just build rosetta-x86_64 "$VERSION"
                  fi

            - name: Report compiler cache statistics
              if: ${{ always() }}
              run: ccache -s

            - name: Refuse a modified checkout
              shell: bash
              run: |
                  if [[ -n "$(git status --porcelain)" ]]; then
                    echo "error: build modified tracked repository files" >&2
                    exit 1
                  fi

            - name: Upload the lane outputs
              uses: actions/upload-artifact@v7.0.1
              with:
                  name: runtime-rosetta-x86_64
                  path: ${{ github.workspace }}/.build/out/rosetta-x86_64/*
                  if-no-files-found: error
                  retention-days: 3

    build-arm64:
        needs: prepare
        if: ${{ needs.prepare.outputs.arm64 == 'true' }}
        runs-on: macos-26
        timeout-minutes: 240
        environment: release-arm64
        permissions:
            contents: read
        env:
            CCACHE_DIR: ${{ github.workspace }}/.ccache
            CCACHE_BASEDIR: ${{ github.workspace }}
            CCACHE_COMPILERCHECK: content
            CCACHE_MAXSIZE: 2G
            LMISXH_AKMOCL_CCACHE: ccache
        steps:
            - name: Check out the dispatched ref
              uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@v10.0.1

            - name: Install just
              uses: extractions/setup-just@v4.0.0

            - name: Run repository checks
              run: just check

            - name: Restore compiler cache
              uses: actions/cache@v4.3.0
              with:
                  path: ${{ github.workspace }}/.ccache
                  key: ${{ runner.os }}-${{ runner.arch }}-ccache-arm64-${{ hashFiles('runtime.lock.json') }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-${{ runner.arch }}-ccache-arm64-${{ hashFiles('runtime.lock.json') }}-
                      ${{ runner.os }}-${{ runner.arch }}-ccache-arm64-

            - name: Restore pinned sources
              uses: actions/cache@v4.3.0
              with:
                  path: |
                      ${{ github.workspace }}/.build/arm64/wine-build-source
                      ${{ github.workspace }}/.build/arm64/dxmt-source
                  key: ${{ runner.os }}-${{ runner.arch }}-arm64-sources-${{ hashFiles('runtime.lock.json') }}

            - name: Restore the llvm-mingw archive
              uses: actions/cache@v4.3.0
              with:
                  path: ${{ github.workspace }}/.build/toolchains/llvm-mingw.tar.xz
                  key: ${{ runner.os }}-${{ runner.arch }}-arm64-toolchain-${{ hashFiles('runtime.lock.json') }}-${{ vars.LLVM_MINGW_SHA256 }}
                  restore-keys: |
                      ${{ runner.os }}-${{ runner.arch }}-arm64-toolchain-${{ hashFiles('runtime.lock.json') }}-
                      ${{ runner.os }}-${{ runner.arch }}-arm64-toolchain-

            - name: Install llvm-mingw
              shell: bash
              env:
                  LLVM_MINGW_URL: ${{ vars.LLVM_MINGW_URL }}
                  LLVM_MINGW_SHA256: ${{ vars.LLVM_MINGW_SHA256 }}
              run: |
                  set -euo pipefail
                  pin="$(uv run --locked --no-dev scripts/targets/llvm_mingw.py)"
                  url="${pin%%$'\n'*}"
                  sha="${pin#*$'\n'}"
                  if [ -z "$url" ]; then
                    url="$LLVM_MINGW_URL"
                    sha="$LLVM_MINGW_SHA256"
                  fi
                  test -n "$url"
                  test -n "$sha"
                  archive=.build/toolchains/llvm-mingw.tar.xz
                  toolchain=.build/toolchains/llvm-mingw
                  mkdir -p .build/toolchains
                  fetch_archive() {
                    curl -fsSL "$url" -o "$archive.part"
                    echo "$sha  $archive.part" | shasum -a 256 -c -
                    mv "$archive.part" "$archive"
                  }
                  if [ ! -f "$archive" ]; then
                    fetch_archive
                  fi
                  if ! echo "$sha  $archive" | shasum -a 256 -c -; then
                    rm -f "$archive"
                    fetch_archive
                  fi
                  mkdir -p "$toolchain"
                  tar -xf "$archive" -C "$toolchain" --strip-components=1
                  echo "LLVM_MINGW_ROOT=$GITHUB_WORKSPACE/$toolchain" >> "$GITHUB_ENV"

            - name: Install build tools
              run: brew install ccache llvm@15 meson ninja bison flex pkg-config

            - name: Build the runtime
              shell: bash
              env:
                  VERSION: ${{ inputs.version }}
                  CHANNEL: ${{ inputs.channel }}
                  ARM64_RELEASE_ID: ${{ inputs.arm64_release_id }}
                  ARM64_RUNTIME_CATALOG_URL: ${{ secrets.ARM64_RUNTIME_CATALOG_URL }}
                  CC: ccache clang
                  CXX: ccache clang++
              run: |
                  set -euo pipefail
                  if [[ "$CHANNEL" == release ]]; then
                    just build-release native-arm64 "$VERSION"
                  else
                    just build native-arm64 "$VERSION"
                  fi

            - name: Report compiler cache statistics
              if: ${{ always() }}
              run: if command -v ccache >/dev/null; then ccache -s; fi

            # The catalog fetch may re-pin runtime.lock.json on purpose; provenance records it.
            - name: Refuse a modified checkout
              shell: bash
              run: |
                  if [[ -n "$(git status --porcelain -- . ':!runtime.lock.json')" ]]; then
                    echo "error: build modified tracked repository files" >&2
                    exit 1
                  fi

            - name: Upload the lane outputs
              uses: actions/upload-artifact@v7.0.1
              with:
                  name: runtime-native-arm64
                  path: ${{ github.workspace }}/.build/out/native-arm64/*
                  if-no-files-found: error
                  retention-days: 3

    # Combining runs repository code, so it gets read-only permissions. The publish job
    # downloads its output and never checks out the repository.
    combine:
        needs: [prepare, build-x86_64, build-arm64]
        if: ${{ inputs.channel == 'release' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - name: Check out the dispatched ref
              uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@v10.0.1

            - name: Download the x86_64 outputs
              uses: actions/download-artifact@v8.0.2
              with:
                  name: runtime-rosetta-x86_64
                  path: ${{ runner.temp }}/lanes/rosetta-x86_64

            - name: Download the ARM64 outputs
              uses: actions/download-artifact@v8.0.2
              with:
                  name: runtime-native-arm64
                  path: ${{ runner.temp }}/lanes/native-arm64

            - name: Combine the lane outputs
              shell: bash
              env:
                  VERSION: ${{ inputs.version }}
                  LANES_DIRECTORY: ${{ runner.temp }}/lanes
                  RELEASE_DIRECTORY: ${{ runner.temp }}/release
              run: |
                  set -euo pipefail
                  uv run --locked --no-dev scripts/release/combine.py \
                    --version "$VERSION" \
                    --input "$LANES_DIRECTORY/rosetta-x86_64" \
                    --input "$LANES_DIRECTORY/native-arm64" \
                    --output "$RELEASE_DIRECTORY" \
                    --require rosetta-x86_64,native-arm64
                  artifact="$(jq -r '.runtimes[] | select(.target == "native-arm64") | .wine.artifact.id' \
                    "$RELEASE_DIRECTORY/provenance.json")"
                  {
                    echo "Runtime lanes: x86_64 (Rosetta 2) and native ARM64."
                    echo
                    echo "The ARM64 lane ships an external Wine artifact ($artifact). Huge thanks to @riverfog7 for providing this runtime. Built in the [wine-build-new](https://github.com/riverfog7/wine-build-new) repository."
                  } > "$RUNNER_TEMP/RELEASE-NOTES.md"
                  mv "$RUNNER_TEMP/RELEASE-NOTES.md" "$RELEASE_DIRECTORY/RELEASE-NOTES.md"

            - name: Upload the combined release
              uses: actions/upload-artifact@v7.0.1
              with:
                  name: runtime-release
                  path: ${{ runner.temp }}/release/*
                  if-no-files-found: error
                  retention-days: 3

    publish:
        needs: [prepare, combine]
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            contents: write
            id-token: write
            attestations: write
        env:
            RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
            RELEASE_DIRECTORY: ${{ github.workspace }}/.build/release
        steps:
            - name: Download the combined release
              uses: actions/download-artifact@v8.0.2
              with:
                  name: runtime-release
                  path: ${{ github.workspace }}/.build/release

            - name: Re-check the tag and release before creation
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  tag_probe="$RUNNER_TEMP/runtime-tag-probe-final"
                  if gh api --method GET --include \
                    "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
                    > "$tag_probe" 2>/dev/null; then
                    echo "error: tag $RELEASE_TAG appeared during the build; refusing to mutate it" >&2
                    exit 1
                  fi
                  tag_http_status="$(awk '$1 ~ /^HTTP\// { status=$2 } END { print status }' "$tag_probe")"
                  if [[ "$tag_http_status" != 404 ]]; then
                    echo "error: could not prove that tag $RELEASE_TAG is still absent" >&2
                    exit 1
                  fi

                  release_probe="$RUNNER_TEMP/runtime-release-probe-final"
                  if gh api --method GET --include \
                    "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
                    > "$release_probe" 2>/dev/null; then
                    echo "error: release $RELEASE_TAG appeared during the build; refusing to mutate it" >&2
                    exit 1
                  fi
                  http_status="$(awk '$1 ~ /^HTTP\// { status=$2 } END { print status }' "$release_probe")"
                  if [[ "$http_status" != 404 ]]; then
                    echo "error: could not prove that release $RELEASE_TAG is still absent" >&2
                    exit 1
                  fi

            - name: Attest release assets
              uses: actions/attest-build-provenance@v4.2.2
              with:
                  subject-path: |
                      ${{ github.workspace }}/.build/release/*
                      !${{ github.workspace }}/.build/release/RELEASE-NOTES.md

            - name: Create exact tag and draft release
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  BUILD_COMMIT: ${{ github.sha }}
              run: |
                  set -euo pipefail
                  cleanup() {
                    status=$?
                    trap - ERR
                    echo "error: tag $RELEASE_TAG may now exist at $BUILD_COMMIT; it is intentionally retained" >&2
                    echo "error: inspect the partial state and use a new version for corrections" >&2
                    exit "$status"
                  }
                  trap cleanup ERR

                  gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                    -f ref="refs/tags/$RELEASE_TAG" \
                    -f sha="$BUILD_COMMIT" >/dev/null
                  # The new ref can read as 404 for a moment after the POST.
                  tag_sha=""
                  for attempt in 1 2 3 4 5; do
                    if tag_sha="$(gh api --method GET \
                      "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"; then
                      break
                    fi
                    sleep $((attempt * 2))
                  done
                  if [[ "$tag_sha" != "$BUILD_COMMIT" ]]; then
                    echo "error: created tag does not reference the verified build SHA" >&2
                    exit 1
                  fi

                  assets=()
                  for asset in "$RELEASE_DIRECTORY"/*; do
                    if [[ "$(basename "$asset")" != RELEASE-NOTES.md ]]; then
                      assets+=("$asset")
                    fi
                  done
                  prerelease=()
                  if [[ "$RELEASE_TAG" == *-* ]]; then
                    prerelease=(--prerelease)
                  fi
                  gh release create "$RELEASE_TAG" "${assets[@]}" "${prerelease[@]}" \
                    --repo "$GITHUB_REPOSITORY" \
                    --verify-tag \
                    --title "Arknights macOS Runtime $RELEASE_TAG" \
                    --notes-file "$RELEASE_DIRECTORY/RELEASE-NOTES.md" \
                    --draft \
                    --latest=false
                  trap - ERR
