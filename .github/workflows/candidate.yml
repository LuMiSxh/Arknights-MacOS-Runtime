name: Candidate

on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: candidate-${{ github.ref }}
    cancel-in-progress: false

env:
    PYTHONDONTWRITEBYTECODE: "1"
    CCACHE_DIR: ${{ github.workspace }}/.ccache
    CCACHE_BASEDIR: ${{ github.workspace }}
    CCACHE_COMPILERCHECK: content
    CCACHE_MAXSIZE: 1G
    LMISXH_AKMOCL_CCACHE: ccache

jobs:
    build:
        runs-on: xcode-27
        timeout-minutes: 300
        steps:
            - name: Check out source
              uses: actions/checkout@v7.0.1

            - name: Install uv
              uses: astral-sh/setup-uv@v10.0.1

            - name: Install Rosetta
              run: softwareupdate --install-rosetta --agree-to-license

            - name: Install Nix
              uses: cachix/install-nix-action@v31.11.1
              with:
                  extra_nix_config: |
                      extra-platforms = x86_64-darwin

            - name: Install build tools
              run: brew install ccache mingw-w64 meson ninja

            - name: Restore compiler cache
              uses: actions/cache@v4.3.0
              with:
                  path: ${{ github.workspace }}/.ccache
                  key: ${{ runner.os }}-${{ runner.arch }}-ccache-canary-${{ hashFiles('runtime.lock.json') }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-${{ runner.arch }}-ccache-canary-${{ hashFiles('runtime.lock.json') }}-
                      ${{ runner.os }}-${{ runner.arch }}-ccache-canary-

            - name: Restore downloaded sources
              uses: actions/cache@v4.3.0
              with:
                  path: ${{ github.workspace }}/.build/downloads
                  key: ${{ runner.os }}-${{ runner.arch }}-downloads-${{ hashFiles('runtime.lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-${{ runner.arch }}-downloads-

            - name: Build isolated overlay canary
              run: uv run --locked --no-dev scripts/build.py canary

            - name: Report compiler cache statistics
              if: ${{ always() }}
              run: ccache -s

            - name: Upload runtime canary
              uses: actions/upload-artifact@v7.0.1
              with:
                  name: Arknights-MacOS-Runtime-canary-${{ github.sha }}
                  path: |
                      .build/runtime/Arknights-MacOS-Runtime.tar.gz
                      .build/runtime/Arknights-MacOS-Runtime.tar.gz.sha256
                      .build/reports/*.json
                  if-no-files-found: error
                  retention-days: 3
