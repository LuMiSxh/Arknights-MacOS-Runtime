name: Draft ARM64 Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: SemVer version; the workflow appends +arm
                required: true
                type: string
            release_id:
                description: Catalog release id; leave empty for the newest ARM64 release
                required: false
                type: string

permissions: {}

concurrency:
    group: runtime-release
    cancel-in-progress: false

env:
    PYTHONDONTWRITEBYTECODE: "1"
    CCACHE_DIR: ${{ github.workspace }}/.ccache
    CCACHE_BASEDIR: ${{ github.workspace }}
    CCACHE_COMPILERCHECK: content
    CCACHE_MAXSIZE: 2G
    LMISXH_AKMOCL_CCACHE: ccache

jobs:
    validate:
        runs-on: macos-26
        timeout-minutes: 240
        environment: release-arm64
        permissions:
            contents: read
        outputs:
            tag: ${{ steps.version.outputs.tag }}
            build_commit: ${{ steps.version.outputs.build_commit }}
        steps:
            - uses: actions/checkout@v7.0.1

            - uses: astral-sh/setup-uv@v10.0.1

            - uses: extractions/setup-just@v4.0.0

            - name: Normalize the version
              id: version
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  set -euo pipefail
                  tag="$(uv run --locked --no-dev python -c \
                    'import sys; from scripts.release.verify import normalize_version; print(normalize_version(sys.argv[1]))' \
                    "$VERSION")"
                  case "$tag" in
                    *+arm) ;;
                    *+*) echo "error: the version must use +arm, not another architecture" >&2; exit 1 ;;
                    *) tag="${tag}+arm" ;;
                  esac
                  {
                    echo "tag=$tag"
                    echo "build_commit=$(git rev-parse --verify HEAD)"
                  } >> "$GITHUB_OUTPUT"

            - run: just check

            - name: Restore compiler cache
              uses: actions/cache@v4.3.0
              with:
                  path: ${{ github.workspace }}/.ccache
                  key: ${{ runner.os }}-${{ runner.arch }}-ccache-arm64-${{ hashFiles('runtime.lock.json') }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-${{ runner.arch }}-ccache-arm64-${{ hashFiles('runtime.lock.json') }}-
                      ${{ runner.os }}-${{ runner.arch }}-ccache-arm64-

            - name: Restore pinned sources
              uses: actions/cache@v4.3.0
              with:
                  path: |
                      ${{ github.workspace }}/.build/arm64/wine-build-source
                      ${{ github.workspace }}/.build/arm64/dxmt-source
                  key: ${{ runner.os }}-${{ runner.arch }}-arm64-sources-${{ hashFiles('runtime.lock.json') }}

            - name: Restore the llvm-mingw archive
              uses: actions/cache@v4.3.0
              with:
                  path: ${{ github.workspace }}/.build/toolchains/llvm-mingw.tar.xz
                  key: ${{ runner.os }}-${{ runner.arch }}-arm64-toolchain-${{ hashFiles('runtime.lock.json') }}-${{ vars.LLVM_MINGW_SHA256 }}
                  restore-keys: |
                      ${{ runner.os }}-${{ runner.arch }}-arm64-toolchain-${{ hashFiles('runtime.lock.json') }}-
                      ${{ runner.os }}-${{ runner.arch }}-arm64-toolchain-

            - name: Fetch the external Wine artifact
              env:
                  ARM64_RUNTIME_CATALOG_URL: ${{ secrets.ARM64_RUNTIME_CATALOG_URL }}
                  RELEASE_ID: ${{ inputs.release_id }}
              run: |
                  uv run --locked --no-dev scripts/arm64/fetch_external.py \
                    --target native-arm64 \
                    --release-id "$RELEASE_ID" \
                    --output .build/arm64/incoming

            - name: Install llvm-mingw
              env:
                  LLVM_MINGW_URL: ${{ vars.LLVM_MINGW_URL }}
                  LLVM_MINGW_SHA256: ${{ vars.LLVM_MINGW_SHA256 }}
              run: |
                  set -euo pipefail
                  pin="$(uv run --locked --no-dev scripts/arm64/llvm_mingw.py)"
                  url="${pin%%$'\n'*}"
                  sha="${pin#*$'\n'}"
                  if [ -z "$url" ]; then
                    url="$LLVM_MINGW_URL"
                    sha="$LLVM_MINGW_SHA256"
                  fi
                  test -n "$url"
                  test -n "$sha"
                  archive=.build/toolchains/llvm-mingw.tar.xz
                  toolchain=.build/toolchains/llvm-mingw
                  mkdir -p .build/toolchains
                  fetch_archive() {
                    curl -fsSL "$url" -o "$archive.part"
                    echo "$sha  $archive.part" | shasum -a 256 -c -
                    mv "$archive.part" "$archive"
                  }
                  if [ ! -f "$archive" ]; then
                    fetch_archive
                  fi
                  if ! echo "$sha  $archive" | shasum -a 256 -c -; then
                    rm -f "$archive"
                    fetch_archive
                  fi
                  mkdir -p "$toolchain"
                  tar -xf "$archive" -C "$toolchain" --strip-components=1

            - name: Read the macOS deployment target from the lock
              run: |
                  set -euo pipefail
                  floor="$(uv run --locked --no-dev python -c \
                    'from scripts.runtime import load_lock; print(load_lock(target="native-arm64")["deploymentTarget"])')"
                  echo "MACOSX_DEPLOYMENT_TARGET=$floor" >> "$GITHUB_ENV"

            - name: Build DXMT for ARM64EC
              env:
                  LLVM_MINGW_ROOT: ${{ github.workspace }}/.build/toolchains/llvm-mingw
                  CC: ccache clang
                  CXX: ccache clang++
              run: |
                  brew install ccache llvm@15 meson ninja bison flex pkg-config
                  uv run --locked --no-dev scripts/arm64/build_dxmt.py \
                    --target native-arm64 \
                    --root .build/arm64 \
                    --llvm "$(brew --prefix llvm@15)" \
                    --llvm-mingw "$LLVM_MINGW_ROOT"

            - name: Report compiler cache statistics
              if: ${{ always() }}
              run: if command -v ccache >/dev/null; then ccache -s; fi

            - name: Repack the client runtime tree
              run: |
                  uv run --locked --no-dev scripts/arm64/assemble.py \
                    --wine .build/arm64/incoming/wine \
                    --dxmt .build/arm64/dxmt \
                    --output .build/arm64/Libraries

            - name: Validate the runtime tree
              run: |
                  uv run --locked --no-dev scripts/validate_runtime.py \
                    .build/arm64/Libraries \
                    --target native-arm64

            - name: Package the runtime archive
              env:
                  TAG: ${{ steps.version.outputs.tag }}
              run: |
                  set -euo pipefail
                  tag="$TAG"
                  mkdir -p .build/arm64/release
                  archive=".build/arm64/release/Arknights-MacOS-Runtime-$tag.tar.gz"
                  tar -czf "$archive" -C .build/arm64 Libraries Licenses NOTICE.md
                  (cd "$(dirname "$archive")" && shasum -a 256 "$(basename "$archive")" > "$(basename "$archive").sha256")

            - name: Package the corresponding source archive
              env:
                  TAG: ${{ steps.version.outputs.tag }}
              run: |
                  set -euo pipefail
                  tag="$TAG"
                  source_archive=".build/arm64/release/Arknights-MacOS-Runtime-$tag-source.tar.gz"
                  tar -czf "$source_archive" \
                    wine-build-new runtime.lock.json docs/arm/README.md
                  (cd "$(dirname "$source_archive")" && shasum -a 256 "$(basename "$source_archive")" > "$(basename "$source_archive").sha256")

            - name: Write provenance
              env:
                  TAG: ${{ steps.version.outputs.tag }}
                  BUILD_COMMIT: ${{ steps.version.outputs.build_commit }}
              run: |
                  set -euo pipefail
                  tag="$TAG"
                  uv run --locked --no-dev scripts/arm64/provenance.py \
                    --target native-arm64 \
                    --tag "$tag" \
                    --commit "$BUILD_COMMIT" \
                    --runtime-archive ".build/arm64/release/Arknights-MacOS-Runtime-$tag.tar.gz" \
                    --source-archive ".build/arm64/release/Arknights-MacOS-Runtime-$tag-source.tar.gz" \
                    --external-artifact .build/arm64/incoming/external.json \
                    --validation-report .build/reports/arm64-validation.json \
                    --output .build/arm64/release/provenance.json

            - name: Copy the notices
              run: cp .build/arm64/NOTICE.md .build/arm64/release/NOTICE.md

            - name: Write release notes
              run: |
                  set -euo pipefail
                  artifact="$(uv run --locked --no-dev python -c \
                    'import json; print(json.load(open(".build/arm64/incoming/external.json"))["id"])')"
                  cat > .build/arm64/release/RELEASE-NOTES.md <<EOF
                  Huge thanks to @riverfog7 for providing this runtime. Built in the [wine-build-new](https://github.com/riverfog7/wine-build-new) repository.

                  External Wine artifact: $artifact.
                  EOF

            - uses: actions/upload-artifact@v7.0.1
              with:
                  name: arm64-release
                  path: .build/arm64/release/**
                  if-no-files-found: error

    publish:
        needs: validate
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/download-artifact@v8.0.2
              with:
                  name: arm64-release
                  path: .build/arm64/release

            - name: Refuse an existing tag or release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ needs.validate.outputs.tag }}
              run: |
                  set -euo pipefail
                  if git ls-remote --exit-code --refs origin "refs/tags/$TAG" >/dev/null 2>&1; then
                    echo "error: tag $TAG already exists; corrections require a new version" >&2
                    exit 1
                  else
                    tag_status=$?
                    if [[ "$tag_status" -ne 2 ]]; then
                      echo "error: could not verify whether tag $TAG exists" >&2
                      exit 1
                    fi
                  fi

                  release_probe="$RUNNER_TEMP/runtime-release-probe"
                  if gh api --method GET --include \
                    "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
                    > "$release_probe" 2>/dev/null; then
                    echo "error: release $TAG already exists; corrections require a new version" >&2
                    exit 1
                  fi
                  http_status="$(awk '$1 ~ /^HTTP\// { status=$2 } END { print status }' "$release_probe")"
                  if [[ "$http_status" != 404 ]]; then
                    echo "error: could not prove that release $TAG does not exist" >&2
                    exit 1
                  fi

            - name: Create the tag at the built commit
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ needs.validate.outputs.tag }}
                  BUILD_COMMIT: ${{ needs.validate.outputs.build_commit }}
              run: |
                  set -euo pipefail
                  gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                    -f ref="refs/tags/$TAG" \
                    -f sha="$BUILD_COMMIT"

            - name: Attest the release assets
              uses: actions/attest-build-provenance@v4.2.2
              with:
                  subject-path: .build/arm64/release/*.tar.gz

            - name: Create the draft release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ needs.validate.outputs.tag }}
              run: |
                  set -euo pipefail
                  gh release create "$TAG" \
                    ".build/arm64/release/Arknights-MacOS-Runtime-$TAG.tar.gz" \
                    ".build/arm64/release/Arknights-MacOS-Runtime-$TAG.tar.gz.sha256" \
                    ".build/arm64/release/Arknights-MacOS-Runtime-$TAG-source.tar.gz" \
                    ".build/arm64/release/Arknights-MacOS-Runtime-$TAG-source.tar.gz.sha256" \
                    ".build/arm64/release/provenance.json" \
                    ".build/arm64/release/NOTICE.md" \
                    --repo "$GITHUB_REPOSITORY" \
                    --verify-tag \
                    --title "Arknights macOS Runtime $TAG" \
                    --notes-file .build/arm64/release/RELEASE-NOTES.md \
                    --draft \
                    --latest=false
