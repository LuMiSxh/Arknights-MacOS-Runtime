name: Draft ARM64 Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: SemVer version; the workflow appends +arm
                required: true
                type: string

permissions: {}

concurrency:
    group: runtime-release
    cancel-in-progress: false

env:
    PYTHONDONTWRITEBYTECODE: "1"

jobs:
    validate:
        runs-on: macos-26
        timeout-minutes: 240
        environment: release-arm64
        permissions:
            contents: read
        outputs:
            tag: ${{ steps.version.outputs.tag }}
            build_commit: ${{ steps.version.outputs.build_commit }}
        steps:
            - uses: actions/checkout@v7.0.1

            - uses: astral-sh/setup-uv@v10.0.1

            - name: Normalize the version
              id: version
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  set -euo pipefail
                  tag="$(uv run --locked --no-dev python -c \
                    'import sys; from scripts.release.verify import normalize_version; print(normalize_version(sys.argv[1]))' \
                    "$VERSION")"
                  case "$tag" in
                    *+arm) ;;
                    *+*) echo "error: the version must use +arm, not another architecture" >&2; exit 1 ;;
                    *) tag="${tag}+arm" ;;
                  esac
                  {
                    echo "tag=$tag"
                    echo "build_commit=$(git rev-parse --verify HEAD)"
                  } >> "$GITHUB_OUTPUT"

            - run: just check

            - name: Fetch the external Wine artifact
              env:
                  ARM64_RUNTIME_CATALOG_URL: ${{ secrets.ARM64_RUNTIME_CATALOG_URL }}
              run: |
                  uv run --locked --no-dev scripts/arm64/fetch_external.py \
                    --target native-arm64 \
                    --output .build/arm64/incoming

            - name: Install llvm-mingw
              env:
                  LLVM_MINGW_URL: ${{ vars.LLVM_MINGW_URL }}
                  LLVM_MINGW_SHA256: ${{ vars.LLVM_MINGW_SHA256 }}
              run: |
                  set -euo pipefail
                  test -n "$LLVM_MINGW_URL"
                  test -n "$LLVM_MINGW_SHA256"
                  mkdir -p .build/toolchains
                  curl -fsSL "$LLVM_MINGW_URL" -o .build/toolchains/llvm-mingw.tar.xz
                  echo "$LLVM_MINGW_SHA256  .build/toolchains/llvm-mingw.tar.xz" | shasum -a 256 -c -
                  mkdir -p .build/toolchains/llvm-mingw
                  tar -xf .build/toolchains/llvm-mingw.tar.xz -C .build/toolchains/llvm-mingw --strip-components=1

            - name: Build DXMT for ARM64EC
              env:
                  MACOSX_DEPLOYMENT_TARGET: "26.0"
                  LLVM_MINGW_ROOT: ${{ github.workspace }}/.build/toolchains/llvm-mingw
              run: |
                  brew install llvm@15 meson ninja bison flex pkg-config
                  uv run --locked --no-dev scripts/arm64/build_dxmt.py \
                    --target native-arm64 \
                    --root .build/arm64 \
                    --llvm "$(brew --prefix llvm@15)" \
                    --llvm-mingw "$LLVM_MINGW_ROOT"

            - name: Repack the client runtime tree
              run: |
                  uv run --locked --no-dev scripts/arm64/assemble.py \
                    --wine .build/arm64/incoming/wine \
                    --dxmt .build/arm64/dxmt \
                    --output .build/arm64/Libraries

            - name: Validate the runtime tree
              run: |
                  uv run --locked --no-dev scripts/validate_runtime.py \
                    .build/arm64/Libraries \
                    --target native-arm64

            - name: Reject a Mach-O above the macOS 26 floor
              run: |
                  set -euo pipefail
                  while IFS= read -r -d '' binary; do
                    minos="$(vtool -show-build "$binary" | awk '/minos/ {print $2; exit}')"
                    test -n "$minos"
                    awk -v value="$minos" -v floor=26.0 'BEGIN { split(value, v, "."); split(floor, f, "."); if (v[1] > f[1] || (v[1] == f[1] && v[2] > f[2])) exit 1 }' \
                      || { echo "error: $binary records minos $minos" >&2; exit 1; }
                  done < <(find .build/arm64/Libraries -type f -perm -111 -print0)

            - name: Package the runtime archive
              run: |
                  set -euo pipefail
                  tag="${{ steps.version.outputs.tag }}"
                  mkdir -p .build/arm64/release
                  archive=".build/arm64/release/Arknights-MacOS-Runtime-$tag.tar.gz"
                  tar -czf "$archive" -C .build/arm64 Libraries Licenses NOTICE.md
                  shasum -a 256 "$archive" > "$archive.sha256"

            - name: Package the corresponding source archive
              run: |
                  set -euo pipefail
                  tag="${{ steps.version.outputs.tag }}"
                  source_archive=".build/arm64/release/Arknights-MacOS-Runtime-$tag-source.tar.gz"
                  tar -czf "$source_archive" \
                    wine-build-new runtime.lock.json docs/arm/provenance.md
                  shasum -a 256 "$source_archive" > "$source_archive.sha256"

            - name: Write provenance
              run: |
                  set -euo pipefail
                  tag="${{ steps.version.outputs.tag }}"
                  uv run --locked --no-dev scripts/arm64/provenance.py \
                    --target native-arm64 \
                    --tag "$tag" \
                    --runtime-archive ".build/arm64/release/Arknights-MacOS-Runtime-$tag.tar.gz" \
                    --source-archive ".build/arm64/release/Arknights-MacOS-Runtime-$tag-source.tar.gz" \
                    --output .build/arm64/release/provenance.json

            - name: Copy the notices
              run: cp .build/arm64/NOTICE.md .build/arm64/release/NOTICE.md

            - name: Write release notes
              run: |
                  cat > .build/arm64/release/RELEASE-NOTES.md <<'EOF'
                  Huge thanks to @riverfog7 for providing this runtime. Built in the [wine-build-new](https://github.com/riverfog7/wine-build-new) repository.
                  EOF

            - uses: actions/upload-artifact@v7.0.1
              with:
                  name: arm64-release
                  path: .build/arm64/release/**
                  if-no-files-found: error

    publish:
        needs: validate
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v7.0.1

            - uses: actions/download-artifact@v8.0.2
              with:
                  name: arm64-release
                  path: .build/arm64/release

            - name: Refuse an existing tag or release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ needs.validate.outputs.tag }}
              run: |
                  set -euo pipefail
                  if git ls-remote --exit-code --refs origin "refs/tags/$TAG" >/dev/null 2>&1; then
                    echo "error: tag $TAG already exists" >&2
                    exit 1
                  fi
                  if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                    echo "error: release $TAG already exists" >&2
                    exit 1
                  fi

            - name: Create the tag at the built commit
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ needs.validate.outputs.tag }}
                  BUILD_COMMIT: ${{ needs.validate.outputs.build_commit }}
              run: |
                  set -euo pipefail
                  gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                    -f ref="refs/tags/$TAG" \
                    -f sha="$BUILD_COMMIT"

            - name: Attest the release assets
              uses: actions/attest-build-provenance@v4.2.2
              with:
                  subject-path: .build/arm64/release/*.tar.gz

            - name: Create the draft release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ needs.validate.outputs.tag }}
              run: |
                  set -euo pipefail
                  gh release create "$TAG" \
                    ".build/arm64/release/Arknights-MacOS-Runtime-$TAG.tar.gz" \
                    ".build/arm64/release/Arknights-MacOS-Runtime-$TAG.tar.gz.sha256" \
                    ".build/arm64/release/Arknights-MacOS-Runtime-$TAG-source.tar.gz" \
                    ".build/arm64/release/Arknights-MacOS-Runtime-$TAG-source.tar.gz.sha256" \
                    ".build/arm64/release/provenance.json" \
                    ".build/arm64/release/NOTICE.md" \
                    --repo "$GITHUB_REPOSITORY" \
                    --verify-tag \
                    --title "Arknights macOS Runtime $TAG" \
                    --notes-file .build/arm64/release/RELEASE-NOTES.md \
                    --draft \
                    --latest=false
